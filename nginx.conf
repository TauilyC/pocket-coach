server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # HTML e service worker sempre revalidados, para novas versões chegarem logo
  location ~* ^/(index\.html|mapa\.html|coach\.html|sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
  location /icons/ { add_header Cache-Control "public, max-age=604800"; }
  location /fonts/ { add_header Cache-Control "public, max-age=2592000, immutable"; }
  location / { try_files $uri $uri/ =404; }
}

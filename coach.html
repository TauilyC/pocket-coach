<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{if(top!==self)document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach · Rumo</title>
<meta name="theme-color" content="#13172B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{overscroll-behavior:none}#app{padding-top:env(safe-area-inset-top)}nav{padding-bottom:env(safe-area-inset-bottom)}.fab{bottom:calc(84px + env(safe-area-inset-bottom))}.toast{bottom:calc(92px + env(safe-area-inset-bottom))}</style>

<style>
/* Direção: mesa de coach noturna. Tinta azul-índigo, açafrão para o estado atual, verde-água para o desejado. Coluna única de celular. */
:root{
  --bg:#13172B; --bg-outer:#0B0E1C; --surface:#1B2042; --surface2:#262C58; --line:#2F3664;
  --text:#EEF0FA; --muted:#98A1C8; --accent:#F4B860; --accent-ink:#241803; --teal:#5FD0C0; --rose:#F58497;
  --lilac:#A99BF2; --sky:#6EB6F5;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
.embed .sbrand{display:none}
.embed .top:has(.brand){display:none}
html,body{height:100%;margin:0}
body{background:var(--bg-outer);color:var(--text);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.top{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.top h1{font-size:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
.brand svg{width:26px;height:26px}
main{flex:1;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;color:var(--muted);font-size:12px;font-weight:600}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.cap::first-letter{text-transform:uppercase}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--rose)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.tag.demo{background:transparent;border:1px dashed var(--muted)}
.tag.low{background:rgba(245,132,151,.16);color:var(--rose)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.teal>i{background:var(--teal)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--muted);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.radar{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .mold{stroke:var(--muted);stroke-width:1.6;fill:rgba(255,255,255,.025)}
.radar .cur{fill:rgba(244,184,96,.22);stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.radar .prv{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:2 3;stroke-linejoin:round}
.legend i.p{border-top:3px dotted var(--muted)}
.evo text{font-family:var(--body,inherit)}
.radar .des{fill:rgba(95,208,192,.07);stroke:var(--teal);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.radar .dot{fill:var(--accent)}
.radar .lbl{fill:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer}
.radar .lbl.sel{fill:var(--accent)}
.radar .lbl2{fill:var(--text);font-size:12px;font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:3px dashed var(--teal)}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .bar{grid-column:1/-1}
.val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:700;margin-left:6px}
.delta.up{color:var(--teal)}.delta.dn{color:var(--rose)}
/* overlays */
.overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;animation:rise .22s ease-out}
.overlay .head{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.overlay .body{flex:1;overflow-y:auto;padding:8px 18px 20px;display:flex;flex-direction:column;gap:16px}
.overlay .foot{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--surface)}
.overlay .foot .btn{flex:1}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:20px;color:var(--muted)}
.prog{flex:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{position:absolute;inset:0;background:rgba(5,7,16,.6);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;animation:rise .2s ease-out}
.grip{width:44px;height:4px;border-radius:9px;background:var(--line);align-self:center}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 14px;min-height:46px}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6F78A3}
/* scales */
.q{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.scale{display:flex;gap:4px}
.scale button{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.likert{display:flex;flex-direction:column;gap:10px}
.likert button{padding:15px 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600;display:flex;gap:12px;align-items:center}
.likert button b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:13px}
.likert button.on{border-color:var(--accent);background:rgba(244,184,96,.14)}
.likert button.on b{background:var(--accent);color:var(--accent-ink)}
.stmt{font-family:var(--display);font-size:26px;line-height:1.2;font-weight:700;text-wrap:balance}
/* mood */
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:center}
.mood .em{font-size:40px;line-height:1}
.mood .nm{font-weight:700}
.mood.on{border-color:var(--accent);background:rgba(244,184,96,.12)}
.moodlock{display:flex;flex-direction:column;gap:14px;transition:opacity .2s}
.moodlock.on{opacity:.45;filter:grayscale(.5);pointer-events:none;user-select:none}
.saved{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(95,208,192,.12);border:1px solid var(--teal)}
.saved .ck{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.dots{display:flex;gap:6px;margin-top:2px}
.dots span{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg)}
.dots span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{position:relative;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.chk::after{content:'';position:absolute;inset:-9px}
.chk.on{background:var(--teal);border-color:var(--teal)}
.chk svg{width:15px;height:15px;stroke:#06201C;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task .tx{flex:1;min-width:0;text-align:left}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.fab{position:absolute;right:16px;bottom:84px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4)}
/* chat */
.bub{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.45}
.bub.c{background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.bub.u{background:var(--accent);color:var(--accent-ink);font-weight:600;border-top-right-radius:6px;align-self:flex-end}
.bub.new{animation:pop .35s ease-out both}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid button{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.pgrid .val{color:var(--accent)}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--text);color:#13172B;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;font-weight:700}
.stepper .val{min-width:30px;text-align:center}
.bf{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.bf:first-child{border-top:0}
.track s{position:absolute;top:-3px;bottom:-3px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.75);border-radius:6px}
.polos{display:flex;justify-content:space-between;gap:16px;font-weight:600;font-size:15px;line-height:1.3}
.scale.afs button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.scale.afs button small{font-size:9.5px;font-weight:600;opacity:.8}
.polos span{flex:1}.polos span:last-child{text-align:right}
.track{position:relative;height:10px;border-radius:99px;background:var(--surface2)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track u{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.arrow{font-weight:700;font-size:15px;min-width:34px;text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--text)}
.top .l{display:flex;align-items:center;gap:12px;min-width:0}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:'+';color:var(--accent);font-size:24px;line-height:1}
details[open].card summary::after{content:'−'}
.refs p{font-size:13px;color:var(--muted);padding-left:16px;text-indent:-16px;margin:8px 0}
.about p,.about li{font-size:15px}
.about ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:rgba(244,184,96,.08);border-radius:0 10px 10px 0;font-size:14px}
.spark{width:100%;height:60px;display:block}

/* ===== desktop / tablet ===== */
.sbrand,.kbd{display:none}
@media (min-width:860px){.mbr{display:none}}
@media (min-width:860px){
  #app{max-width:none;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);box-shadow:none}
  #layer{grid-area:2/2;width:0;height:0}
  nav{grid-column:1;grid-row:1/-1;flex-direction:column;gap:4px;padding:22px 14px;border-top:0;border-right:1px solid var(--line);align-items:stretch}
  .sbrand{display:flex;margin:0 6px 22px;font-size:21px}
  nav button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;border-radius:13px;font-size:15px;justify-content:flex-start}
  nav button:hover{background:var(--surface2);color:var(--text)}
  nav button.on{background:var(--surface2);color:var(--accent)}
  nav .kbd{display:inline-block;margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .top{grid-column:2;grid-row:1;padding:26px 40px 8px;min-height:0}
  .top .brand{display:none}
  .top h1{font-size:30px}
  #app:has(main.wide) .top{padding-inline:max(40px,calc((100% - 1080px)/2))}
  #app:has(main:not(.wide)) .top{padding-inline:max(40px,calc((100% - 760px)/2))}
  main{grid-column:2;grid-row:2;padding:8px max(40px,calc((100% - 760px)/2)) 48px;gap:16px}
  main.wide{padding-inline:max(40px,calc((100% - 1080px)/2))}
  .radar{max-width:440px}
  .overlay{inset:4vh 0;margin:0 auto;width:min(720px,94vw);border-radius:24px;border:1px solid var(--line);box-shadow:0 0 0 100vmax rgba(5,7,16,.62),0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  .overlay .body{padding:10px 28px 24px}
  .overlay .head{padding:18px 24px 8px}
  .overlay .foot{padding:14px 24px 20px}
  .scrim{align-items:center;justify-content:center}
  .sheet{width:min(580px,94vw);max-height:90%;border-radius:22px;border-bottom:1px solid var(--line)}
  .fab{right:40px;bottom:32px}
  .toast{bottom:32px}
  .btn:hover:not([disabled]){filter:brightness(1.1)}
  .chip:hover,.pgrid button:hover,.mood:hover,.likert button:hover{border-color:var(--muted)}
}
@media (min-width:1180px){
  main.wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:18px}
  main.wide>.span2,main.wide>.banner,main.wide>.seg{grid-column:1/-1}
  main.s-roda>section:nth-of-type(1):not(:only-of-type){grid-column:1;grid-row:2/span 3;position:sticky;top:0}
  main.s-roda>section:nth-of-type(n+2),main.s-roda>button{grid-column:2}
  main.s-roda>section:nth-of-type(1):only-of-type{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <main id="main"></main>
  <nav id="nav" aria-label="Navegação principal"></nav>
  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(()=>{
'use strict';
/* ============ utilidades ============ */
const KEY='pocketcoach.v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dk(d)};
const today=()=>dk(new Date());
const f1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const fdate=(k,o)=>parse(k).toLocaleDateString('pt-BR',o||{day:'numeric',month:'short'});
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;

/* ============ dados: pilares ============ */
const P=[
 {id:'sau',ab:'SAU',n:'Saúde e disposição',area:'Pessoal'},
 {id:'int',ab:'INT',n:'Intelecto e habilidades',area:'Pessoal'},
 {id:'emo',ab:'EMO',n:'Equilíbrio emocional',area:'Pessoal'},
 {id:'car',ab:'CAR',n:'Carreira e negócios',area:'Contribuição social'},
 {id:'fin',ab:'FIN',n:'Finanças',area:'Contribuição social'},
 {id:'res',ab:'RES',n:'Responsabilidade social',area:'Contribuição social'},
 {id:'fam',ab:'FAM',n:'Família',d:'pais, irmãos e filhos',area:'Relacionamentos'},
 {id:'amo',ab:'AMO',n:'Relacionamento amoroso',area:'Relacionamentos'},
 {id:'soc',ab:'SOC',n:'Vida social',area:'Relacionamentos'},
 {id:'laz',ab:'LAZ',n:'Lazer',d:'hobbies e diversão',area:'Qualidade de vida'},
 {id:'esp',ab:'ESP',n:'Espiritualidade',area:'Qualidade de vida'},
 {id:'sat',ab:'SAT',n:'Satisfação com a vida',area:'Qualidade de vida'}];
const PM=Object.fromEntries(P.map(p=>[p.id,p]));

const COND=[
 {k:'estudante',t:'Sou estudante'},
 {k:'aposentado',t:'Sou aposentado(a)'},
 {k:'filhos',t:'Tenho filhos'},
 {k:'solteiro',t:'Não tenho relacionamento amoroso'}];

function afScores(ans){

}
/* Funcionamento Emocional Global: vontade + controle + coping + cautela − raiva − sensibilidade − medo + 60 */
function afFeg(b){

  return s.vol+s.con+s.cop+b.fa.inh[1]-s.ang-s.sen-b.fa.inh[0]+60;

function afRef(k){
  const d=AFM[k];if(!d.nm)return null;
  const r=S.afRef||'g';
  if(r==='m')return d.nm;if(r==='f')return d.nf;
  return [(d.nm[0]+d.nf[0])/2,(d.nm[1]+d.nf[1])/2];
}

/* radar: 0% = pontuação mínima, 100% = máxima de cada dimensão */
function afRadar(sc){
  const DD=AFD.filter(d=>sc[d.k]!=null),n=DD.length;
  const cx=200,cy=165,R=104;
  const ang=i=>(-90+i*360/n)*Math.PI/180;
  const pt=(i,v,r)=>{const rr=(r==null?R:r)*v;return[cx+rr*Math.cos(ang(i)),cy+rr*Math.sin(ang(i))]};
  const nv=(d,x)=>{const m=d.ix.length;return Math.max(0,Math.min(1,(x-m)/(6*m)))};
  const rf=d=>{const r=afRef(d.k);return r?r[0]:4*d.ix.length};
  const poly=f=>DD.map((d,i)=>pt(i,f(d)).map(x=>x.toFixed(1)).join(',')).join(' ');
  let s='<svg viewBox="0 0 400 330" class="radar" role="img" aria-label="Gráfico radial do temperamento emocional: '+DD.map(d=>d.n+' '+sc[d.k]).join(', ')+'">';
  [.25,.5,.75,1].forEach(v=>{s+='<polygon class="'+(v===1?'mold':'ring')+'" points="'+poly(()=>v)+'"/>'});
  DD.forEach((d,i)=>{const q=pt(i,1);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'"/>'});
  s+='<polygon class="prv" points="'+poly(d=>nv(d,rf(d)))+'"/>';
  s+='<polygon class="cur" points="'+poly(d=>nv(d,sc[d.k]))+'"/>';
  DD.forEach((d,i)=>{const q=pt(i,nv(d,sc[d.k]));s+='<circle class="dot" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.8"/>'});
  DD.forEach((d,i)=>{
    const q=pt(i,1,R+14),c=Math.cos(ang(i)),sn=Math.sin(ang(i));
    const an=c>.3?'start':c<-.3?'end':'middle';
    s+='<text class="lbl" style="cursor:default;font-size:13px" x="'+q[0].toFixed(1)+'" y="'+(q[1]+(sn>.3?10:sn<-.3?-2:4)).toFixed(1)+'" text-anchor="'+an+'">'+d.n+'</text><text class="lbl2" style="font-size:13.5px" x="'+q[0].toFixed(1)+'" y="'+(q[1]+(sn>.3?24:sn<-.3?12:18)).toFixed(1)+'" text-anchor="'+an+'">'+sc[d.k]+'</text>';
  });
  return s+'</svg>';
}

  let d=today(),n=0,miss=0;
  if(!set.has(d))d=addD(d,-1);
  for(let i=0;i<400;i++){
    if(set.has(d)){n++;miss=0}

    d=addD(d,-1);
  }
  return n;
}

function rulerFeedback(o){

  if(c<=4)return 'Importância '+i+' e confiança '+c+'. Você quer avançar, mas duvida da própria capacidade, e isso é comum. A teoria da autoeficácia sugere que passos pequenos e viáveis ajudam a construir confiança. Vamos desenhar um primeiro passo bem menor.';
  if(c>=9)return 'Importância '+i+' e confiança '+c+'. Ponto de partida favorável. Um cuidado: confiança muito alta pode levar a subestimar obstáculos, por isso o plano vai incluir o que pode atrapalhar.';

function rankSubs(pid){
  const la=loadAvg(),hiLoad=la!=null&&la>=5,SE=afLevel('sen'),CP=afLevel('cop'),CT=afLevel('con'),IN=afLevel('inh'),VO=afLevel('vol');
  return CH[pid].subs.map((s,i)=>{

    if(s[2]==='soc'&&IN===2){sc=2;why='Sugerida pelo seu temperamento (inibição acima da referência: passos graduais)'}
    if(s[2]==='lim'&&CP===0){sc=2;why='Sugerida pelo seu temperamento (coping abaixo da referência: pendências e conflitos)'}

function spark(pr){
  if(pr.length<2)return '';
  const W=300,H=60,n=pr.length,x=i=>10+i*(W-20)/(n-1),y=v=>H-8-(v/10)*(H-16);
  return '<svg class="spark" viewBox="0 0 300 60" role="img" aria-label="Progresso percebido ao longo do tempo"><polyline points="'+pr.map((e,i)=>x(i).toFixed(1)+','+y(e.v).toFixed(1)).join(' ')+'" fill="none" stroke="var(--teal)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+pr.map((e,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(e.v).toFixed(1)+'" r="3.4" fill="var(--teal)"/>').join('')+'</svg>';
}

async function saveFile(name,mime,txt,label){
  try{
    const file=new File([txt],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:label});toast(label+' pronto');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(label+' gerado. Abra o arquivo para adicionar ao calendário');
  }catch(e){toast('Não foi possível gerar o arquivo neste ambiente')}
}

function ovAbout(){

   ['Visão geral','<p>O Pocket Coach é uma ferramenta de autodesenvolvimento orientada a metas. O fluxo segue o ciclo de autorregulação da teoria do controle (Carver & Scheier, 1982): perceber onde estou, definir aonde quero chegar, planejar, agir, monitorar o progresso e ajustar.</p><p>Na meta-análise de Theeboom et al. (2014), intervenções de coaching em contexto organizacional tiveram efeitos positivos, de g = 0,43 (enfrentamento) a g = 0,74 (autorregulação orientada a metas). São dados de coaching com profissional, em organizações. Eles não demonstram a eficácia deste aplicativo, que ainda precisa ser testado.</p>',true],
   ['Roda da Vida','<p>O instrumento é atribuído a Paul J. Meyer (Success Motivation Institute, década de 1960) e nasceu na prática de coaching. Até onde sabemos, não há estudos psicométricos que sustentem a estrutura de 12 pilares; aqui ele é um recurso de reflexão e priorização, não uma medida validada.</p><p>Cada afirmação recebe nota de 0 a 10 e o escore do pilar é a média dos itens. Pilares com 3 itens (Equilíbrio emocional e Vida social) têm menos precisão. O molde circular representa a roda ideal; a distância entre ele e o seu desenho mostra onde a roda “trepida”. Não suavizamos a curva entre pilares, porque valores entre duas categorias não têm significado.</p>'],
   ['Humor diário','<p>Medidas momentâneas repetidas ao longo do dia captam variações que a lembrança retrospectiva distorce (avaliação momentânea ecológica; Shiffman et al., 2008). As seis dimensões vêm do modelo do POMS (McNair et al., 1971): tensão, depressão, raiva, vigor, fadiga e confusão.</p><p>Aqui cada dimensão é medida por um único emoji, com intensidade de 1 a 4. É um rastreio de tendência, não uma escala validada. Para pesquisa, a versão brasileira de referência é a Escala de Humor de Brunel (BRUMS/BRAMS; Rohlfs et al., 2008), com 24 itens.</p>'],
   ['Temperamento emocional (AFECTS)','<p>Esta parte usa a seção emocional da Escala de Temperamentos Afetivos e Emocionais Compostos (AFECTS; Ottoni, Lorenzi et al., 2010; Lara et al., 2012). É uma escala bipolar de 7 pontos. Os 48 itens formam seis dimensões de 8 itens: Vontade, Raiva, Inibição, Sensibilidade, Coping e Controle, com escore de 8 a 56 (soma dos itens). O app acrescenta Desejo, com 4 itens (escore de 4 a 28), tratada como preliminar: não tem normas publicadas e é mostrada sem faixa de referência.</p><p>Cada dimensão tem duas facetas de 4 itens: Vontade (positividade e energia), Raiva (intensidade e irritabilidade), Inibição (medo e cautela), Sensibilidade (interpessoal e a eventos), Coping (encarar e resolver) e Controle (foco e ordem). No formulário, os itens 17 a 32 trazem o polo alto à esquerda; o app inverte esses itens na soma, para que, em todas as dimensões, pontuação maior signifique mais daquela dimensão.</p><p>O Funcionamento Emocional Global (FEG) combina as dimensões: vontade + controle + coping + cautela − raiva − sensibilidade − medo + 60. Foi construído a partir da correlação com um escore de adaptação; aqui é mostrado sem pontos de corte e sem Desejo.</p><p>A faixa de referência vem das médias e desvios-padrão do estudo original: cerca de 2.900 respondentes pela internet, em sua maioria mulheres, população geral, não clínica. A faixa clara cobre aproximadamente a metade central dos respondentes. É uma referência aproximada, não uma norma clínica. O app não inclui a seção afetiva (os doze temperamentos afetivos) nem classifica tipos.</p><p>O feedback de cada dimensão descreve o que ela é e adapta o texto à sua pontuação (abaixo, na faixa ou acima da referência), usando também suas facetas e algumas combinações entre dimensões. No modelo, o temperamento não tem valor moral: cada configuração tem vantagens e vulnerabilidades, e interage com o contexto e com a história de vida. Por isso o resultado serve de contexto para planejar metas, não de rótulo nem de alvo. As dicas por dimensão são hipóteses de trabalho, ainda sem teste empírico neste formato.</p>'],
   ['Metas e plano','<ul><li><b>Réguas de importância e confiança.</b> Vêm da Entrevista Motivacional (Miller & Rollnick, 2013) e da autoeficácia (Bandura, 1977). Importância baixa pede explorar valores; confiança baixa pede um passo menor.</li><li><b>Metas.</b> Metas específicas e desafiadoras, com feedback e compromisso, melhoram o desempenho (Locke & Latham, 2002). Preferimos metas de aproximação às de evitação (Elliot & Church, 1997).</li><li><b>Motivos.</b> Metas ligadas a valores próprios sustentam melhor o esforço e o bem-estar (Ryan & Deci, 2000; Sheldon & Elliot, 1999).</li><li><b>Contraste mental e “se-então”.</b> Imaginar o resultado desejado e o obstáculo, e então formular intenções de implementação, ajuda a agir (Oettingen, 2012). As intenções de implementação têm efeito médio-grande (d = 0,65; Gollwitzer & Sheeran, 2006).</li><li><b>Monitoramento.</b> Acompanhar o progresso aumenta a chance de atingir a meta (d = 0,40), sobretudo quando é registrado (Harkin et al., 2016). Por isso a revisão pede progresso e confiança.</li><li><b>Hábitos.</b> A mediana foi de 66 dias para a automatização, de 18 a 254 (Lally et al., 2010). Não prometemos “21 dias”.</li><li><b>Técnicas.</b> O fluxo reúne técnicas da taxonomia de Michie et al. (2013): definição de metas, planejamento de ação, automonitoramento e revisão de metas.</li></ul>'],
   ['O que evitamos','<ul><li>Promessas de transformação rápida e o mito dos “21 dias”.</li><li>SMART como se fosse teoria científica: a sigla é de 1981, do campo da administração (Doran, 1981). Usamos princípios com base empírica na teoria de metas.</li><li>Pensamento positivo isolado: imaginar só o sucesso, sem considerar obstáculos, pode reduzir o esforço (Oettingen, 2012).</li><li>Tipologias e rótulos de temperamento como destino.</li><li>Conselhos prontos: o coach pergunta, reflete e deixa a decisão com você.</li></ul>'],
   ['Limites e cuidados','<ul><li>Não é psicoterapia nem avaliação clínica e não substitui um profissional.</li><li>Dados de humor são sensíveis: neste app ficam apenas no seu aparelho (veja Privacidade e dados). Uma versão com conta exigirá consentimento e proteção conforme a LGPD.</li><li>Em sofrimento intenso, procure um profissional de saúde mental. Se estiver pensando em se machucar, ligue 188 (CVV, 24 horas) ou procure um serviço de urgência.</li></ul>'],
   ['Próximas etapas de validação','<ul><li>Roda da Vida: análise fatorial exploratória e confirmatória, consistência interna por pilar e invariância entre grupos.</li><li>Temperamento: confirmar a autorização de uso do instrumento, validar o formato do app (ordem dos itens e resposta em toque) frente ao formulário em papel e comparar com normas por idade e sexo.</li><li>Eficácia: estudo piloto com lista de espera, medindo autoeficácia, bem-estar e atingimento de metas (por exemplo, Goal Attainment Scaling; Kiresuk & Sherman, 1968).</li></ul>']];
  return '<div class="head"><button class="x" data-a="close" aria-label="Voltar">‹</button><div class="prog"><div class="eyebrow">Fundamentos</div></div></div><div class="body about"><h2 style="font-size:28px">Como o Coach funciona</h2><p class="muted">Cada etapa do aplicativo tem uma justificativa na literatura científica, e cada limite está declarado.</p>'+S1.map(s=>'<details class="card"'+(s[2]?' open':'')+'><summary>'+s[0]+'</summary><div class="col" style="margin-top:10px">'+s[1]+'</div></details>').join('')+'<details class="card"><summary>Referências</summary><div class="refs" style="margin-top:8px">'+REFS.map(r=>'<p>'+esc(r)+'</p>').join('')+'</div></details></div>';
}

deste aparelho. Não dá para desfazer.</p>'+(o.wipe?'<div class="note">Tem certeza? Faça um backup antes se quiser guardar algo.</div><div class="row"><button class="btn danger" style="flex:1" data-a="wipe">Sim, apagar tudo</button><button class="btn ghost" data-a="wipeNo">Cancelar</button></div>':'<button class="btn danger" data-a="wipeAsk">Apagar todos os meus dados</button>')+'</section></div>';
}
function cleanImport(d){
  const num=(x,a,b,def)=>{x=Number(x);return isFinite(x)?Math.max(a,Math.min(b,x)):def};
  const dt=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)?x:today();
  const str=(x,n)=>String(x==null?'':x).slice(0,n||600);
  const arr=x=>Array.isArray(x)?x:[];
  const ob=x=>(x&&typeof x==='object')?x:{};
  const o={demo:false,cond:{},n:1000+Math.max(0,Math.floor(num(d.n,0,1e6,0)))};
  COND.forEach(c=>{if(ob(d.cond)[c.k])o.cond[c.k]=true});
  o.history=arr(d.history).slice(-60).map(h=>{const sc={};P.forEach(p=>{sc[p.id]=num(ob(ob(h).scores)[p.id],0,10,0)});return{date:dt(ob(h).date),scores:sc}});
  o.desired={};P.forEach(p=>{if(ob(d.desired)[p.id]!=null)o.desired[p.id]=Math.round(num(d.desired[p.id],0,10,8))});
  const as=ob(ob(d.af).scores),fo=ob(ob(d.af).fa);
  const fdims=AFD.filter(t=>t.fn);
  o.af=d.af&&d.af.scores?{scores:Object.fromEntries(AFD.filter(t=>as[t.k]!=null).map(t=>[t.k,Math.round(num(as[t.k],t.ix.length,7*t.ix.length,4*t.ix.length))])),fa:fdims.every(t=>Array.isArray(fo[t.k]))?Object.fromEntries(fdims.map(t=>[t.k,[0,1].map(j=>Math.round(num(fo[t.k][j],4,28,16)))])):null,date:dt(d.af.date),demo:false}:null;
  o.afRef=['g','f','m'].includes(d.afRef)?d.afRef:'g';
  o.onb=true;
  o.moods=arr(d.moods).slice(-1500).filter(m=>TURNS.some(t=>t.k===ob(m).turn)).map(m=>({date:dt(m.date),turn:m.turn,v:Object.fromEntries(MOODS.map(k=>[k.k,Math.round(num(ob(m.v)[k.k],0,4,0))]))}));
  o.goals=arr(d.goals).slice(0,300).filter(g=>PM[ob(g).p]).map(g=>({id:str(g.id,24)||'x'+Math.random().toString(36).slice(2,8),p:g.p,titulo:str(g.titulo,300),medida:str(g.medida),porque:str(g.porque),resultado:str(g.resultado),obstaculo:str(g.obstaculo),se:str(g.se,300),entao:str(g.entao,300),motivos:arr(g.motivos).filter(m=>MOTS[m]),desafio:g.desafio==null?null:Math.round(num(g.desafio,1,5,3)),imp:g.imp==null?null:Math.round(num(g.imp,0,10,5)),conf:g.conf==null?null:Math.round(num(g.conf,0,10,5)),rev:num(g.rev,1,60,7),prog:arr(g.prog).slice(-200).map(e=>({date:dt(ob(e).date),v:Math.round(num(ob(e).v,0,10,0)),c:Math.round(num(ob(e).c,0,10,5))})),due:dt(g.due),status:g.status==='concluida'?'concluida':g.status==='pausada'?'pausada':'ativa',created:dt(g.created),base:g.base==null?null:num(g.base,0,10,0)}));
  o.tasks=arr(d.tasks).slice(0,3000).map(t=>ob(t)).filter(t=>str(t.title)).map(t=>({id:str(t.id,24)||'x'+Math.random().toString(36).slice(2,8),title:str(t.title,300),goal:t.goal?str(t.goal,24):null,due:/^\d{4}-\d{2}-\d{2}$/.test(t.due)?t.due:null,rec:['daily','weekly','days'].includes(t.rec)?t.rec:'none',days:arr(t.days).map(Number).filter(n=>n>=0&&n<=6).slice(0,7),time:/^\d{2}:\d{2}$/.test(t.time)?t.time:'',done:!!t.done,log:arr(t.log).slice(-800).map(dt)}));
  o.reviews=arr(d.reviews).slice(-300).map(r=>({date:dt(ob(r).date),a:{ok:str(ob(ob(r).a).ok),stuck:str(ob(ob(r).a).stuck),adj:str(ob(ob(r).a).adj)}}));
  o.rest=arr(d.rest).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).slice(-400);
  o.alertMute=(d.alertMute&&/^\d{4}-\d{2}-\d{2}$/.test(d.alertMute.until))?{until:d.alertMute.until,tier:Math.round(num(d.alertMute.tier,1,2,1))}:null;
  return o;
}
function importData(txt){
  try{
    const j=JSON.parse(txt),d=(j&&j.app==='pocket-coach'&&j.data)?j.data:j;
    if(!d||typeof d!=='object'||!Array.isArray(d.history))throw new Error('formato');
    const o=cleanImport(d);
    Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,o);save();
    ui.ov=null;ui.stack=[];ui.tab='home';ui.selP=null;ui.mood=null;render();toast('Backup importado');
  }catch(e){toast('Não consegui ler esse backup')}
}
function backupText(){return JSON.stringify({app:'pocket-coach',v:2,exported:new Date().toISOString(),data:S},null,1)}
async function exportBackup(){
  const txt=backupText(),name='pocket-coach-backup-'+today()+'.json';
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup do Pocket Coach'});toast('Backup pronto');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Backup gerado. Se não baixou, use “Copiar como texto”');
  }catch(e){toast('Use “Copiar como texto”')}
}
async function copyBackup(){
  const txt=backupText();
  try{await navigator.clipboard.writeText(txt);toast('Backup copiado. Cole em um lugar seguro');return}catch(e){}
  const t=document.getElementById('bk-txt');if(t){t.value=txt;t.focus();t.select();toast('Selecione e copie o texto')}
}
function wipeAll(){
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S,{demo:false,cond:{},history:[],desired:{},af:null,onb:true,moods:[],goals:[],tasks:[],reviews:[],rest:[],alertMute:null,n:10});
  try{localStorage.removeItem(HO_DONE)}catch(e){}
  save();ui.ov=null;ui.stack=[];ui.tab='home';ui.selP=null;ui.mood=null;render();toast('Dados apagados');
}

function ovHtml(o){return o.type==='roda'?ovRoda(o):o.type==='onb'?ovOnb(o):o.type==='af'?ovAf(o):o.type==='pick'?ovPick():o.type==='coach'?ovCoach(o):o.type==='about'?ovAbout():o.type==='guide'?ovGuide():o.type==='limit'?ovLimit():o.type==='des'?ovDes(o):o.type==='privacy'?ovPrivacy(o):ovGoal(o)}

const TITLES={home:'Hoje',avaliar:'Avaliar',metas:'Metas',plano:'Plano'};

  rollRec();
  const main=$('#main'),sc=main.scrollTop;
  const bk=ui.stack.length?'<button class="back" data-a="back" aria-label="Voltar"><span aria-hidden="true">‹</span> Voltar</button>':'';
  const brand='<div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--accent)" stroke-width="2.4"/><circle cx="16" cy="16" r="7" fill="none" stroke="var(--teal)" stroke-width="2.4" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="2.4" fill="var(--accent)"/></svg>Pocket Coach</div>';
  $('#top').innerHTML=bk?'<div class="l">'+bk+'<h1 style="font-size:21px">'+TITLES[ui.tab]+'</h1></div>':(ui.tab==='home'?brand:'<h1>'+TITLES[ui.tab]+'</h1>');
  main.className=(ui.tab==='home'||(ui.tab==='avaliar'&&ui.sub==='roda')?'wide ':'')+(ui.tab==='avaliar'&&ui.sub==='roda'?'s-roda':'');
  main.innerHTML=ui.tab==='home'?viewHome():ui.tab==='avaliar'?viewAvaliar():ui.tab==='metas'?viewMetas():viewPlano();
  main.scrollTop=sc;
  const oc=main.querySelector('[data-a="evoSel"].on');if(oc&&oc.parentElement)oc.parentElement.scrollLeft=Math.max(0,oc.offsetLeft-60);
  $('#nav').innerHTML='<div class="brand sbrand">'+brand.replace('<div class="brand">','').replace(/<\/div>$/,'')+'</div>'+[['home','Hoje'],['avaliar','Avaliar'],['metas','Metas'],['plano','Plano']].map((a,i)=>'<button class="'+(ui.tab===a[0]?'on':'')+'" data-a="navtab" data-id="'+a[0]+'" aria-label="'+a[1]+'"'+(ui.tab===a[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+icon[a[0]]+'</svg>'+a[1]+'<span class="kbd" aria-hidden="true">'+(i+1)+'</span></button>').join('');
  const L=$('#layer'),ob=L.querySelector('.overlay .body'),osc=ob?ob.scrollTop:0,keep=ui.ovKeep;
  let h='';
  if(ui.ov){const o=ui.ov;h+='<div class="overlay" role="dialog" aria-modal="true">'+ovHtml(o)+'</div>'}
  if(ui.sheet){const s=ui.sheet;h+='<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">'+(s.type==='task'?shTask(s):s.type==='goal'?shGoal(s):shReview(s))+'</div></div>'}
  L.innerHTML=h;
  if(keep){const nb=L.querySelector('.overlay .body');if(nb)nb.scrollTop=osc;ui.ovKeep=false}
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
const go=(tab,sub)=>{ui.tab=tab;if(sub)ui.sub=sub;ui.ov=null;ui.sheet=null;$('#main').scrollTop=0;render()};

/* ============ ações ============ */
function completeTask(t){
  const d=today();
  if(t.log.includes(d)){t.log=t.log.filter(x=>x!==d);if(t.rec==='none')t.done=false;else t.due=d;return}
  t.log.push(d);
  if(t.rec==='none')t.done=true;else t.due=nextDue(t,d);
}
function finishRoda(o){
  const sc={};
  P.forEach(p=>{const a=o.ans[p.id];sc[p.id]=mean(a)});
  if(S.demo)clearDemo();
  S.cond=o.cond;S.history.push({date:today(),scores:sc});
  save();o.result=sc;o.step=12;
}
function startCoach(id,from){if(limitHit()){ui.ov={type:'limit'};ui.sheet=null;render();return}ui.ov={type:'coach',p:id,sub:null,imp:null,conf:null,from:from||null};ui.shown=0;ui.sheet=null;render()}
function pushNav(){ui.stack.push({tab:ui.tab,sub:ui.sub,filter:ui.filter})}
function act(a,el){
  const id=el.dataset.id,v=el.dataset.v,o=ui.ov;
  switch(a){
  case 'navtab':ui.stack=[];go(id);break;
  case 'tab':pushNav();go(id);break;
  case 'back':{const b=ui.stack.pop();if(b){ui.tab=b.tab;ui.sub=b.sub;ui.filter=b.filter;ui.ov=null;ui.sheet=null;$('#main').scrollTop=0;render()}break}
  case 'cmp':ui.cmp=id;render();break;
  case 'evoSel':ui.evo=id;render();break;
  case 'muteAlert':S.alertMute={until:addD(today(),3),tier:+v};save();render();break;
  case 'about':ui.ov={type:'about'};render();break;
  case 'guide':ui.ov={type:'guide'};render();break;
  case 'guideGo':{ui.ov=null;ui.sheet=null;
    if(id==='roda'){act('roda',el);break}
    if(id==='humor'){pushNav();moodInit();go('avaliar','humor');break}
    if(id==='perfil'){pushNav();go('avaliar','perfil');break}
    if(id==='des'){pushNav();go('metas');act('desOpen',el);break}
    if(id==='meta'){pushNav();go('metas');act('newGoal',el);break}
    if(id==='tarefa'){pushNav();go('plano');act('newTask',el);break}
    if(id==='rev'){pushNav();go('home');act('review',el);break}
    if(id==='privacy'||id==='about'){act(id,el);break}
    render();break}
  case 'privacy':ui.ov={type:'privacy',wipe:false};render();break;
  case 'wipeAsk':o.wipe=true;render();break;
  case 'wipeNo':o.wipe=false;render();break;
  case 'wipe':wipeAll();break;
  case 'bkExport':exportBackup();break;
  case 'bkCopy':copyBackup();break;
  case 'bkFile':{const f=document.getElementById('bk-file');if(f)f.click();break}
  case 'bkPaste':{const t=document.getElementById('bk-txt');if(t&&t.value.trim())importData(t.value);else toast('Cole o texto do backup primeiro');break}
  case 'sheetBack':{const f=ui.sheet&&ui.sheet.f;ui.sheet=(f&&f.back)?{type:'goal',id:f.back}:null;render();break}
  case 'sub':ui.sub=id;if(id==='humor')moodInit();render();break;
  case 'goMood':pushNav();moodInit();go('avaliar','humor');break;
  case 'selP':ui.selP=id;render();break;
  case 'clearDemo':clearDemo();save();render();toast('Exemplos removidos');break;
  case 'close':if(ui.ov&&ui.ov.type==='af'&&ui.ov.pg>=0){afDraftSave(ui.ov);if(S.afDraft)toast('Progresso salvo. Retome quando quiser.')}if(ui.ov&&ui.ov.type==='onb')S.onb=true,save();ui.ov=null;render();break;
  case 'closeSheet':ui.sheet=null;render();break;
  case 'scrim':ui.sheet=null;render();break;
  case 'closeToRoda':ui.ov=null;ui.tab='avaliar';ui.sub='roda';ui.selP=null;render();break;
  /* roda */
  case 'roda':ui.ov={type:'roda',step:-1,cond:Object.assign({},S.cond||{}),ans:{}};ui.sheet=null;render();break;
  case 'cond':o.cond[id]=!o.cond[id];render();break;
  case 'rodaStart':o.step=0;ui.ovKeep=false;render();break;
  case 'rodaFill':P.forEach(p=>{o.ans[p.id]=itemsFor(p.id,o.cond).map(()=>2+Math.floor(Math.random()*8))});finishRoda(o);render();break;
  case 'ans':{const p=P[o.step];(o.ans[p.id]=o.ans[p.id]||[])[+el.dataset.i]=+v;ui.ovKeep=true;render();break}
  case 'rodaBack':if(o.step<=0)o.step=-1;else o.step--;render();break;
  case 'rodaNext':if(o.step===11)finishRoda(o);else o.step++;render();{const b=$('#layer .overlay .body');if(b)b.scrollTop=0}break;
  /* temperamento (AFECTS) */
  case 'af':ui.ov={type:'af',pg:-1,sex:S.afRef||null,ans:new Array(52).fill(null),draft:(S.afDraft&&Array.isArray(S.afDraft.ans)&&S.afDraft.ans.length===52)?S.afDraft:null};render();break;
  case 'afResume':{const d=o.draft;if(!d)break;o.ans=d.ans.slice();o.sex=d.sex||o.sex;o.pg=Math.max(0,Math.min(AFPAGES.length-1,d.pg));o.draft=null;render();break}
  case 'afFresh':delete S.afDraft;o.draft=null;save();render();break;
  case 'afPause':afDraftSave(o);ui.ov=null;render();toast('Progresso salvo. Retome quando quiser.');break;
  case 'afSex':o.sex=id;render();break;
  case 'afAns':o.ans[+el.dataset.i]=+v;afDraftSave(o);ui.ovKeep=true;render();break;
  case 'afNext':{const last=o.pg===AFPAGES.length-1;if(o.pg>=0&&!afPageItems(o.pg).every(i=>o.ans[i]!=null))break;
    if(!last){o.pg++;render();const bd=$('#layer .overlay .body');if(bd)bd.scrollTop=0}
    else{const r=afScores(o.ans);S.af={scores:r.scores,fa:r.fa,date:today(),demo:false};S.afRef=o.sex||'g';delete S.afDraft;save();ui.ov=null;ui.tab='avaliar';ui.sub='perfil';render();toast('Temperamento salvo')}}break;
  case 'afBack':if(o.pg>=0){o.pg--;render();const bd=$('#layer .overlay .body');if(bd)bd.scrollTop=0}else{ui.ov=null;render()}break;
  case 'onbNext':o.i=Math.min(2,o.i+1);render();break;
  case 'onbBack':o.i=Math.max(0,o.i-1);render();break;
  case 'onbExample':{const ex=seed();Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,ex,{onb:true});save();ui.ov=null;ui.tab='home';render();break}
  case 'onbSkip':S.onb=true;save();ui.ov=null;render();break;
  case 'onbRoda':S.onb=true;save();act('roda',el);break;
  case 'afFb':ui.afOpen=ui.afOpen||{};ui.afOpen[id]=!ui.afOpen[id];render();break;
  case 'afRef':S.afRef=id;save();render();break;
  /* humor */
  case 'turn':if(ui.mood.locked)break;ui.mood.turn=id;{const r=S.moods.find(m=>m.date===today()&&m.turn===id);ui.mood.sel={};ui.mood.locked=!!r;if(r)MOODS.forEach(m=>{if(r.v[m.k]>0)ui.mood.sel[m.k]=r.v[m.k]})}render();break;
  case 'mood':if(ui.mood.locked)break;if(ui.mood.sel[id])delete ui.mood.sel[id];else ui.mood.sel[id]=2;render();break;
  case 'int':if(ui.mood.locked)break;ui.mood.sel[id]=+v;render();break;
  case 'saveMood':{if(ui.mood.locked)break;const vv={};MOODS.forEach(m=>{vv[m.k]=ui.mood.sel[m.k]||0});S.moods=S.moods.filter(m=>!(m.date===today()&&m.turn===ui.mood.turn));S.moods.push({date:today(),turn:ui.mood.turn,v:vv});ui.mood.locked=true;save();render();toast('Humor registrado');{const bd=$('#main');if(bd)bd.scrollTop=0}break}
  case 'moodRedo':ui.mood.locked=false;render();break;
  case 'moodBack':if(ui.stack.length)act('back',el);else{ui.tab='home';$('#main').scrollTop=0;render()}break;
  /* metas / desejada */
  case 'editDes':ui.editDes=!ui.editDes;render();break;
  case 'desOpen':{const c=cur();if(!c)break;const w={};P.forEach(p=>{w[p.id]=S.desired&&S.desired[p.id]!=null?S.desired[p.id]:Math.min(10,Math.round(c.scores[p.id]))});ui.ov={type:'des',v:w,t:{}};ui.sheet=null;render();break}
  case 'desStep':{o.v[id]=Math.max(0,Math.min(10,o.v[id]+(+v)));o.t[id]=true;ui.ovKeep=true;render();break}
  case 'desSave':{S.desired=S.desired||{};P.forEach(p=>{if(o.t[p.id]||S.desired[p.id]!=null)S.desired[p.id]=o.v[p.id]});save();ui.ov=null;toast('Roda desejada salva');render();break}
  case 'newGoal':ui.ov=limitHit()?{type:'limit'}:{type:'pick'};ui.sheet=null;render();break;
  case 'coach':startCoach(id,o&&o.type==='pick'?'pick':null);break;
  case 'sub2':o.sub=+id;o.imp=null;o.conf=null;render();{const b=$('#layer .overlay .body');if(b)b.scrollTop=b.scrollHeight}break;
  case 'otherSub':o.sub=null;o.imp=null;o.conf=null;ui.shown=o.nb||2;render();break;
  case 'coachBack':if(o.sub!=null){o.sub=null;o.imp=null;o.conf=null;ui.shown=o.nb||2;render()}else if(o.from==='pick'){ui.ov={type:'pick'};render()}else{ui.ov=null;render()}break;
  case 'rul':o[el.dataset.k]=+v;render();if(o.imp!=null&&o.conf!=null){const b=$('#layer .overlay .body');if(b)b.scrollTop=b.scrollHeight}break;
  case 'rulReset':o.imp=null;o.conf=null;ui.shown=4;render();break;
  case 'toGoal':{const s=CH[o.p].subs[o.sub][0];ui.ov={type:'goal',p:o.p,step:0,back:{p:o.p,open:o.open,sub:o.sub,imp:o.imp,conf:o.conf,from:o.from},f:{titulo:s,motivos:[],porque:'',medida:'',desafio:null,resultado:'',obstaculo:'',se:'',entao:'',dias:90,rev:7,sel:o.conf<=4?[0]:[0,1],extra:[],custom:'',planTask:true,imp:o.imp,conf:o.conf}};render();break}
  case 'fromMapa':{const it=hoPending().find(i=>i.rid===id);if(!it)break;if(limitHit()){ui.ov={type:'limit'};render();break}
    const p=it.pillar,ex=String(it.practice||'').slice(0,200);
    ui.ov={type:'goal',p:p,step:0,fromMapa:true,f:{fromRid:it.rid,titulo:'Desenvolver: '+String(it.skill).slice(0,120),motivos:[],porque:'',medida:String(it.ind||'').slice(0,300),desafio:null,resultado:'',obstaculo:'',se:'',entao:'',dias:90,rev:7,sel:ex?[STEPS[p].length]:[0],extra:ex?[ex]:[],custom:'',planTask:true,imp:null,conf:null}};
    ui.tab='home';render();break}
  case 'mapaDismiss':hoPending().forEach(i=>hoDone(i.rid));render();toast('Tudo bem. As sugestões saíram daqui');break;
  case 'goalBack':if(o.step>0)o.step--;else if(o.fromMapa)ui.ov=null;else{ui.ov=Object.assign({type:'coach'},o.back);ui.shown=99}render();break;
  case 'mot':{const m=o.f.motivos,k=m.indexOf(id);if(k>=0)m.splice(k,1);else m.push(id);render();break}
  case 'des2':o.f.desafio=+v;render();break;
  case 'rev':o.f.rev=+v;render();break;
  case 'planTask':o.f.planTask=!o.f.planTask;render();break;
  case 'dias':o.f.dias=+v;render();break;
  case 'stepSel':{const i=+el.dataset.i,s=o.f.sel;const k=s.indexOf(i);if(k>=0)s.splice(k,1);else s.push(i);render();break}
  case 'addStep':if(o.f.custom.trim()){o.f.extra.push(o.f.custom.trim());o.f.sel.push(STEPS[o.p].length+o.f.extra.length-1);o.f.custom='';render()}break;
  case 'goalNext':
    if(o.step<5){o.step++;render();{const b=$('#layer .overlay .body');if(b)b.scrollTop=0}break}
    {const f=o.f,gid=nid(),all=STEPS[o.p].concat(f.extra);if(f.fromRid&&S.demo)clearDemo();
     S.goals.push({id:gid,p:o.p,titulo:f.titulo.trim(),motivos:f.motivos.slice(),porque:f.porque.trim(),medida:f.medida.trim(),desafio:f.desafio,resultado:f.resultado.trim(),obstaculo:f.obstaculo.trim(),se:f.se.trim(),entao:f.entao.trim(),imp:f.imp,conf:f.conf,rev:f.rev,prog:[],due:addD(today(),f.dias),status:'ativa',created:today(),base:cur()?cur().scores[o.p]:null});
     f.sel.slice().sort((a,b)=>a-b).forEach((i,k)=>S.tasks.push({id:nid(),title:all[i],goal:gid,due:addD(today(),1+k*2),rec:'none',done:false,log:[]}));
     let n=f.sel.length;
     if(f.planTask&&f.se.trim()&&f.entao.trim()){S.tasks.push({id:nid(),title:'Plano: se '+f.se.trim()+', então '+f.entao.trim(),goal:gid,due:addD(today(),1),rec:'daily',done:false,log:[]});n++}
     if(f.fromRid)hoDone(f.fromRid);
     save();ui.ov=null;ui.tab='metas';render();toast('Meta criada com '+n+(n===1?' passo':' passos'));}
    break;
  case 'goal':ui.sheet={type:'goal',id:id};render();break;
  case 'doneGoal':{const g=S.goals.find(x=>x.id===id);g.status='concluida';save();ui.sheet=null;render();toast('Meta concluída');break}
  case 'pauseGoal':{const g=S.goals.find(x=>x.id===id);g.status='pausada';save();ui.sheet=null;render();toast('Meta pausada. Você pode retomá-la quando quiser');break}
  case 'reopenGoal':{if(limitHit()){ui.sheet=null;ui.ov={type:'limit'};render();break}S.goals.find(x=>x.id===id).status='ativa';save();ui.sheet=null;render();break}
  case 'delGoal':S.goals=S.goals.filter(x=>x.id!==id);S.tasks.forEach(t=>{if(t.goal===id)t.goal=null});save();ui.sheet=null;render();toast('Meta excluída');break;
  case 'stepFor':ui.sheet={type:'task',f:{id:null,title:'',goal:id,due:addD(today(),1),rec:'none',back:id}};render();break;
  /* tarefas */
  case 'filter':ui.filter=id;render();break;
  case 'tog':{const t=S.tasks.find(x=>x.id===id);completeTask(t);save();render();break}
  case 'newTask':ui.sheet={type:'task',f:{id:null,title:'',goal:'',due:today(),rec:'none',days:[],time:''}};render();break;
  case 'editTask':{const t=S.tasks.find(x=>x.id===id),prevSheet=ui.sheet;ui.sheet={type:'task',f:{id:t.id,title:t.title,goal:t.goal||'',due:t.due||'',rec:t.rec,days:(t.days||[]).slice(),time:t.time||'',back:prevSheet&&prevSheet.type==='goal'?prevSheet.id:null}};render();break}
  case 'tdue':ui.sheet.f.due=v;render();break;
  case 'trec':ui.sheet.f.rec=v;if(v==='days'&&!(ui.sheet.f.days||[]).length)ui.sheet.f.days=[parse(ui.sheet.f.due||today()).getDay()];render();break;
  case 'tday':{const f=ui.sheet.f,i=+v;f.days=f.days||[];f.days=f.days.includes(i)?f.days.filter(x=>x!==i):f.days.concat(i);render();break}
  case 'rest':{S.rest=S.rest||[];const t=today();S.rest=S.rest.includes(t)?S.rest.filter(x=>x!==t):S.rest.concat(t).slice(-400);save();render();toast(isRest()?'Dia de descanso registrado. Nada fica pendente hoje':'Descanso de hoje cancelado');break}
  case 'icsTask':{const f=ui.sheet.f;if(!f.title.trim()){toast('Escreva o que fazer');break}if(!f.time){toast('Defina um horário para criar o lembrete');break}if(f.rec==='days'&&!(f.days||[]).length){toast('Escolha ao menos um dia da semana');break}saveFile('pocket-coach-'+f.title.trim().slice(0,24).replace(/[^\w]+/g,'-')+'.ics','text/calendar',taskIcs(f),'Lembrete');break}
  case 'saveTask':{const f=ui.sheet.f;if(!f.title.trim()){toast('Escreva o que fazer');break}
    if(f.rec==='days'&&!(f.days||[]).length){toast('Escolha ao menos um dia da semana');break}
    const dd=f.rec==='days'?firstOn({days:f.days},f.due&&f.due>=today()?f.due:today()):(f.due||null);
    const ex={days:f.rec==='days'?f.days.slice().sort((a,b)=>a-b):[],time:/^\d{2}:\d{2}$/.test(f.time||'')?f.time:''};
    if(f.id){const t=S.tasks.find(x=>x.id===f.id);Object.assign(t,{title:f.title.trim(),goal:f.goal||null,due:dd,rec:f.rec},ex)}
    else S.tasks.push(Object.assign({id:nid(),title:f.title.trim(),goal:f.goal||null,due:dd,rec:f.rec,done:false,log:[]},ex));
    save();ui.sheet=f.back?{type:'goal',id:f.back}:null;render();toast('Tarefa salva');break}
  case 'delTask':{const f=ui.sheet.f;S.tasks=S.tasks.filter(x=>x.id!==f.id);save();ui.sheet=f.back?{type:'goal',id:f.back}:null;render();break}
  case 'review':{const g={};S.goals.filter(x=>x.status==='ativa').forEach(x=>{const pr=x.prog||[],l=pr[pr.length-1];g[x.id]={v:l?l.v:0,c:l?l.c:(x.conf!=null?x.conf:5)}});ui.sheet={type:'review',f:{},g:g};render();break}
  case 'rv':{const r=ui.sheet.g[id],k=el.dataset.k;r[k]=Math.max(0,Math.min(10,r[k]+(+v)));render();break}
  case 'saveReview':{const t=today();S.goals.forEach(x=>{const r=ui.sheet.g[x.id];if(!r)return;x.prog=(x.prog||[]).filter(e=>e.date!==t);x.prog.push({date:t,v:r.v,c:r.c})});S.reviews.push({date:t,a:ui.sheet.f});save();ui.sheet=null;render();toast('Revisão salva');break}
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='scrim'&&e.target!==el)return;
  act(el.dataset.a,el);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.a){e.preventDefault();act(e.target.dataset.a,e.target)}
  if(/^[1-4]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!ui.ov&&!ui.sheet&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')){go(['home','avaliar','metas','plano'][+e.key-1])}
  if(e.key==='Escape'){if(ui.sheet){ui.sheet=null;render()}else if(ui.ov){ui.ov=null;render()}}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(ui.sheet&&ui.sheet.f)ui.sheet.f[f]=e.target.value;
  else if(ui.ov&&ui.ov.f){
    ui.ov.f[f]=e.target.value;
    if(ui.ov.type==='goal'){
      const b=document.querySelector('[data-a="goalNext"]');if(b)b.disabled=!goalValid(ui.ov);
      const h=document.getElementById('g-avoid');if(h&&f==='titulo')h.hidden=!AVOID.test(e.target.value);
    }
  }
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='bk-file'){const fl=e.target.files&&e.target.files[0];if(!fl)return;if(fl.size>8e6){toast('Arquivo grande demais');return}const r=new FileReader();r.onload=()=>importData(String(r.result));r.onerror=()=>toast('Não consegui ler o arquivo');r.readAsText(fl);e.target.value='';return}
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(ui.sheet&&ui.sheet.f)ui.sheet.f[f]=e.target.value;
});
if(!S.onb)ui.ov={type:'onb',i:0};
window.addEventListener('storage',e=>{if(e.key===HO_KEY&&ui.tab==='home'&&!ui.ov&&!ui.sheet)render()});
render();
})();
</script>
<script>
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
